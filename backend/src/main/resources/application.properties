spring.application.name=sistema-bicicletaria
server.port=8081

# ========== DATABASE H2 ==========
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========== H2 CONSOLE ==========
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========== JPA CONFIGURATION ==========
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========== SQL INIT ==========
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ========== SECURITY - COMPLETAMENTE DESABILITADO ==========
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ========== LOGGING ==========
logging.level.org.hibernate.SQL=DEBUG

# Log detalhado do mapeamento
logging.level.org.springframework.web.servlet.mvc=DEBUG
logging.level.org.springframework.web=DEBUG

# Ver todos os endpoints mapeados
logging.level.org.springframework.boot.autoconfigure=DEBUG

# ========== JACKSON CONFIGURATION ==========
# Serializar LocalDateTime como ISO 8601 (string) ao invés de array
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC