<app-header></app-header>

<div class="dashboard-container">
  <!-- Cabeçalho -->
  <div class="dashboard-header">
    <h1>📊 Cadastro - Gestão Completa</h1>
    <p>Gerencie bicicletas, serviços, peças e clientes em um só lugar</p>
  </div>

  <!-- Navegação por Abas -->
  <div class="tabs-navigation">
    <button 
      [class]="'tab-button ' + (activeTab === 'clientes' ? 'active' : '')"
      (click)="setActiveTab('clientes')">
      👥 Clientes
    </button>
    <button 
      [class]="'tab-button ' + (activeTab === 'bicicletas' ? 'active' : '')"
      (click)="setActiveTab('bicicletas')">
      🚲 Bicicletas
    </button>
    <button 
      [class]="'tab-button ' + (activeTab === 'servicos' ? 'active' : '')"
      (click)="setActiveTab('servicos')">
      🔧 Serviços
    </button>
    <button 
      [class]="'tab-button ' + (activeTab === 'pecas' ? 'active' : '')"
      (click)="setActiveTab('pecas')">
      ⚙️ Peças
    </button>
  </div>

  <!-- Loading -->
  <!-- Removido: loading agora é gerenciado pelos componentes filhos -->

  <!-- Error -->
  <!-- Removido: error agora é gerenciado pelos componentes filhos -->

  <!-- Conteúdo das Abas -->
  <div class="tab-content">
    
    <!-- === ABA BICICLETAS === -->
    <div *ngIf="activeTab === 'bicicletas'" class="tab-pane active">
      <app-bicicleta-manager></app-bicicleta-manager>
    </div>

    <!-- === ABA SERVIÇOS === -->
    <div *ngIf="activeTab === 'servicos'" class="tab-pane active">
      <app-servico-manager></app-servico-manager>
    </div>

    <!-- === ABA PEÇAS === -->
    <div *ngIf="activeTab === 'pecas'" class="tab-pane active">
      <app-estoque-manager></app-estoque-manager>
    </div>

    <!-- === ABA CLIENTES === -->
    <div *ngIf="activeTab === 'clientes'" class="tab-pane active">
      <app-cliente-manager></app-cliente-manager>
    </div>
  </div>
</div>
