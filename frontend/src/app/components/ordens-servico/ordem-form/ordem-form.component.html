<div class="form-container">
  <h2 class="form-title">🚴‍♂️ Nova Ordem de Serviço</h2>

  <form [formGroup]="ordemForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-field">
        <label>👤 Cliente</label>
        <select formControlName="cliente" (change)="onClienteChange($any($event.target).value)">
          <option value="">Selecione um cliente</option>
          <option *ngFor="let cliente of clientes" [value]="cliente.id">
            {{ cliente.nome }} - {{ cliente.telefone }}
          </option>
        </select>
        <div class="error" *ngIf="ordemForm.get('cliente')?.errors?.['required'] && ordemForm.get('cliente')?.touched">
          Cliente é obrigatório
        </div>
      </div>

      <div class="form-field">
  <label>🚲 Bicicleta</label>
  <select 
    formControlName="bicicleta" 
    (change)="onBicicletaChange($any($event.target).value)"
  >
    <option value="">Selecione uma bicicleta</option>
    <option 
      *ngFor="let bicicleta of bicicletas" 
      [value]="bicicleta.id"
      [selected]="bicicletaSelecionada?.id === bicicleta.id"
    >
      {{ bicicleta.marca }} - {{ bicicleta.modelo }} ({{ bicicleta.cor }})
    </option>
  </select>
  <div class="error" *ngIf="ordemForm.get('bicicleta')?.errors?.['required'] && ordemForm.get('bicicleta')?.touched">
    Bicicleta é obrigatória
  </div>
</div>
    </div>

    <div class="form-field problema-field">
      <label>🔧 Problema Relatado</label>
      <textarea 
        formControlName="problemaRelatado" 
        placeholder="Descreva detalhadamente o problema relatado pelo cliente..."
        rows="4"
      ></textarea>
      <div class="error" *ngIf="ordemForm.get('problemaRelatado')?.errors?.['required'] && ordemForm.get('problemaRelatado')?.touched">
        Descrição do problema é obrigatória
      </div>
    </div>

    <div class="form-field observacoes-field">
      <label>📝 Observações</label>
      <textarea 
        formControlName="observacoes" 
        placeholder="Observações adicionais, condições da bicicleta, etc..."
        rows="3"
      ></textarea>
    </div>

    <!-- ✅ Informações de Debug (temporário)
    <div *ngIf="clienteSelecionado || bicicletaSelecionada" class="debug-info" style="background: #f0f8ff; padding: 10px; border-radius: 5px; margin: 10px 0;">
      <h4>🔍 Debug - Dados Selecionados:</h4>
      <p *ngIf="clienteSelecionado"><strong>Cliente:</strong> {{ clienteSelecionado.nome }} (ID: {{ clienteSelecionado.id }})</p>
      <p *ngIf="bicicletaSelecionada"><strong>Bicicleta:</strong> {{ bicicletaSelecionada.marca }} {{ bicicletaSelecionada.modelo }} (ID: {{ bicicletaSelecionada.id }})</p>
    </div> -->

    <div class="form-buttons">
      <button type="button" class="cancel-button" (click)="cancel()">
        ❌ Cancelar
      </button>
      <button type="submit" class="save-button" [disabled]="ordemForm.invalid || loading || !clienteSelecionado || !bicicletaSelecionada">
        ✅ Criar Ordem de Serviço
      </button>
    </div>
  </form>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div *ngIf="loading" class="loading-overlay"></div>
</div>
