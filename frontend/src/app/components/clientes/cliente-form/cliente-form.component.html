<app-header></app-header>
<div class="form-container">
  <h2 class="form-title">{{ isEditing ? 'Editar' : 'Novo' }} Cliente</h2>

  <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label>Nome</label>
      <input formControlName="nome" placeholder="Nome do cliente" />
      <div class="error" *ngIf="clienteForm.get('nome')?.errors?.['required']">Nome é obrigatório</div>
      <div class="error" *ngIf="clienteForm.get('nome')?.errors?.['minlength']">Nome deve ter no mínimo 3 caracteres</div>
    </div>

    <div class="form-field">
      <label>Telefone</label>
<input 
    formControlName="telefone" 
    (input)="formatarTelefone($event)" 
    placeholder="(99) 99999-9999"
    maxlength="15" 
  />
  <div class="error" *ngIf="clienteForm.get('telefone')?.errors?.['required'] && clienteForm.get('telefone')?.touched">
    Telefone é obrigatório
  </div>
  <div class="error" *ngIf="clienteForm.get('telefone')?.errors?.['pattern'] && clienteForm.get('telefone')?.touched">
    Formato inválido: (99) 99999-9999
  </div>
    </div>

    <div class="form-field">
      <label>Endereço</label>
      <input formControlName="endereco" placeholder="Endereço completo" />
      <div class="error" *ngIf="clienteForm.get('endereco')?.errors?.['required']">Endereço é obrigatório</div>
    </div>

    <div class="form-field">
      <label>Instagram</label>
      <input formControlName="instagram" placeholder="@usuario" />
    </div>

    <div class="form-buttons">
      <button type="button" class="cancel-button" (click)="cancel()">Cancelar</button>
      <button type="submit" class="save-button" [disabled]="clienteForm.invalid || loading">{{ isEditing ? 'Atualizar' : 'Cadastrar' }}</button>
    </div>
  </form>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="loading" class="loading-overlay">Carregando...</div>
</div>
