<div class="form-container">
  <h2 class="form-title">Nova Bicicleta</h2>

  <form [formGroup]="bicicletaForm" (ngSubmit)="onSubmit()">
    <div *ngIf="!clienteId" class="form-field">
      <label>Cliente</label>
      <select formControlName="cliente">
        <option value="">Selecione um cliente</option>
        <option *ngFor="let cliente of clientes" [value]="cliente.id">{{ cliente.nome }} - {{ cliente.telefone }}</option>
      </select>
      <div class="error" *ngIf="bicicletaForm.get('cliente')?.errors?.['required']">Cliente é obrigatório</div>
    </div>

    <div class="form-field">
      <label>Marca</label>
      <input formControlName="marca" placeholder="Marca da bicicleta" />
      <div class="error" *ngIf="bicicletaForm.get('marca')?.errors?.['required']">Marca é obrigatória</div>
    </div>

    <div class="form-field">
      <label>Modelo</label>
      <input formControlName="modelo" placeholder="Modelo da bicicleta" />
      <div class="error" *ngIf="bicicletaForm.get('modelo')?.errors?.['required']">Modelo é obrigatório</div>
    </div>

    <div class="form-field">
      <label>Tamanho do Aro</label>
      <input type="number" formControlName="tamanhoAro" placeholder="Tamanho do aro" />
      <div class="error" *ngIf="bicicletaForm.get('tamanhoAro')?.errors?.['required']">Tamanho do aro é obrigatório</div>
      <div class="error" *ngIf="bicicletaForm.get('tamanhoAro')?.errors?.['min'] || bicicletaForm.get('tamanhoAro')?.errors?.['max']">Tamanho do aro deve estar entre 12 e 29</div>
    </div>

    <div class="form-field">
      <label>Cor</label>
      <input formControlName="cor" placeholder="Cor da bicicleta" />
      <div class="error" *ngIf="bicicletaForm.get('cor')?.errors?.['required']">Cor é obrigatória</div>
    </div>

    <div class="form-buttons">
      <button type="button" class="cancel-button" (click)="cancel()">Cancelar</button>
      <button type="submit" class="save-button" [disabled]="bicicletaForm.invalid || loading">Cadastrar</button>
    </div>
  </form>

  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="loading" class="loading-overlay">Carregando...</div>
</div>
