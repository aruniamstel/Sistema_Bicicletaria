<header class="app-header">
  <div class="navbar">
    <!-- Logo e Título -->
    <div class="nav-brand">
      <img src="assets/images/logo-cliente.png" alt="Logo Fabiano Bikes" class="header-logo">
    </div>

    <!-- Menu de Navegação -->
    <nav class="nav-menu">
      <!-- Ação Principal: Nova Ordem -->
      <a class="nav-link highlight" [routerLink]="['/ordens-servico/novo']">
        <span class="nav-icon">➕</span>
        Nova Ordem
      </a>

      <!-- Navegação Principal -->
      <a class="nav-link" [routerLink]="['/dashboard']" routerLinkActive="active">
        <span class="nav-icon">📊</span>
        Cadastro
      </a>
      
      <a class="nav-link" [routerLink]="['/ordens-servico']" routerLinkActive="active">
        <span class="nav-icon">📋</span>
        Ordens de Serviço
        <span class="badge" *ngIf="ordensPendentes > 0">{{ ordensPendentes }}</span>
      </a>
      
      <a class="nav-link" [routerLink]="['/bicicletas-em-servico']" routerLinkActive="active">
        <span class="nav-icon">🚲</span>
        Bicicletas em Serviço
      </a>

      <!-- Usuário e Sair -->
      <div class="user-section">
        <a class="nav-link" [routerLink]="['/agenda']" routerLinkActive="active">
        <span class="nav-icon">🗓️</span>
        Agenda
        </a>
        <a class="btn-logout" [routerLink]="['/login']">
          <span class="nav-icon">🚪</span>
          Sair
        </a>
      </div>
    </nav>
  </div>
</header>
